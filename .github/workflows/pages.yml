# site/ 폴더만 GitHub Pages로 내보냅니다.
# main 가지에 올릴(push) 때마다 자동으로 다시 배포됩니다.
name: 발표 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
      - name: Pages 설정
        uses: actions/configure-pages@v5
      - name: site 폴더 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
